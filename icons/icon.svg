<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="breakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="100%" stop-color="#ff7700" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#6366f1" stroke-width="4" opacity="0.3" />

  <!-- Main target tile -->
  <rect x="56" y="56" width="400" height="250" rx="36" fill="url(#tileGrad)" filter="url(#glow)" />
  <text x="256" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="74" fill="#ffffff" text-anchor="middle" letter-spacing="-1">65536</text>

  <!-- Impact / Shatter bolt -->
  <path d="M 230 260 L 270 320 L 250 330 L 282 390 L 245 350 L 262 340 Z" fill="#ffea00" filter="url(#glow)" />

  <!-- Breaker tile 2 -->
  <g transform="translate(64, 340)">
    <rect width="100" height="100" rx="24" fill="#ff0055" />
    <text x="50" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="48" fill="#ffffff" text-anchor="middle">2</text>
  </g>

  <!-- Breaker tile 4 -->
  <g transform="translate(206, 340)">
    <rect width="100" height="100" rx="24" fill="#ff9900" />
    <text x="50" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="48" fill="#ffffff" text-anchor="middle">4</text>
  </g>

  <!-- Breaker tile 8 -->
  <g transform="translate(348, 340)">
    <rect width="100" height="100" rx="24" fill="#00e5ff" />
    <text x="50" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="48" fill="#000000" text-anchor="middle">8</text>
  </g>
</svg>
